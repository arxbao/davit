name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# Only booleans here. A secret declared at workflow level is readable by
# EVERY step, including `swift build` (SwiftPM plugins run arbitrary code) and
# every third-party action. These flags carry the same gating information with
# none of the exposure; the values themselves are attached to the single step
# that consumes each one.
env:
  # Switches the pipeline to Developer ID signing + notarization; without it,
  # builds are ad-hoc signed.
  HAS_SIGNING: ${{ secrets.MACOS_CERT_P12 != '' }}
  # Enables the Homebrew tap bump after release.
  HAS_TAP: ${{ secrets.TAP_PUSH_TOKEN != '' }}
  # Enables publishing the update appcast to davit.app after release.
  HAS_GCS: ${{ secrets.GCS_SA_KEY != '' }}

jobs:
  release:
    # Apple silicon runner; the apple/container dependency needs Swift 6.2+
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - name: Swift version
        run: swift --version

      - name: Cache SPM dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Import signing certificate
        if: env.HAS_SIGNING == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PWD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PWD" build.keychain-db
          security set-keychain-settings -lut 21600 build.keychain-db
          security unlock-keychain -p "$KEYCHAIN_PWD" build.keychain-db
          echo "$MACOS_CERT_P12" | base64 --decode > cert.p12
          security import cert.p12 -k build.keychain-db -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm cert.p12
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PWD" build.keychain-db
          security list-keychains -d user -s build.keychain-db login.keychain-db
          IDENTITY_LINE=$(security find-identity -v -p codesigning build.keychain-db \
            | grep "Developer ID Application" | head -1)
          IDENTITY=$(echo "$IDENTITY_LINE" | sed -E 's/.*"(.+)"/\1/')
          FINGERPRINT=$(echo "$IDENTITY_LINE" \
            | sed -E 's/^[[:space:]]*[0-9]+\)[[:space:]]+([0-9A-F]+).*/\1/')
          if [ -z "$IDENTITY" ]; then
            echo "No Developer ID Application identity found in certificate" >&2
            exit 1
          fi
          # Two Developer ID certificates can carry an IDENTICAL common name, so
          # the name says nothing about which private key is about to sign. Pin
          # the fingerprint instead: exporting the wrong cert from Keychain
          # Access then fails the build loudly rather than shipping quietly.
          # On rotation, update this to the new cert's SHA-1, which
          # `security find-identity -v -p codesigning` prints.
          EXPECTED_CERT_SHA1="89AFE2B56FFCB7344A7600B5E38E97C68A544591"
          if [ "$FINGERPRINT" != "$EXPECTED_CERT_SHA1" ]; then
            echo "Signing certificate is not the expected one." >&2
            echo "  expected: $EXPECTED_CERT_SHA1" >&2
            echo "  imported: $FINGERPRINT" >&2
            exit 1
          fi
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "Using identity: $IDENTITY ($FINGERPRINT)"

      - name: Build app bundle
        run: |
          export VERSION="${GITHUB_REF_NAME#v}"
          scripts/bundle.sh

      - name: Notarize
        if: env.HAS_SIGNING == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          AUTH=(--apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD")
          ditto -c -k --keepParent "dist/Davit.app" "notarize.zip"

          # Submit without --wait: a single long-lived poll session dies to
          # transient runner network flakes. Poll with fresh connections instead.
          SUBMIT=$(xcrun notarytool submit notarize.zip "${AUTH[@]}" --output-format json)
          echo "$SUBMIT"
          SUBMISSION_ID=$(echo "$SUBMIT" | jq -r '.id // empty')
          if [ -z "$SUBMISSION_ID" ]; then
            echo "Submission failed — no id returned" >&2
            exit 1
          fi

          STATUS="In Progress"
          DEADLINE=$((SECONDS + 3300))   # ~55 min
          while [ $SECONDS -lt $DEADLINE ]; do
            sleep 30
            INFO=$(xcrun notarytool info "$SUBMISSION_ID" "${AUTH[@]}" --output-format json 2>&1) || {
              echo "poll error (transient, retrying): $INFO"
              continue
            }
            STATUS=$(echo "$INFO" | jq -r '.status // "unknown"')
            echo "status: $STATUS ($((SECONDS / 60))m elapsed)"
            [ "$STATUS" = "In Progress" ] || break
          done

          # Always fetch Apple's detailed log — it names the exact issues on rejection.
          xcrun notarytool log "$SUBMISSION_ID" "${AUTH[@]}" || true

          if [ "$STATUS" != "Accepted" ]; then
            echo "Notarization not accepted (status: $STATUS)" >&2
            exit 1
          fi
          xcrun stapler staple "dist/Davit.app"
          rm notarize.zip

      - name: Zip app
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ditto -c -k --keepParent "dist/Davit.app" "Davit-${VERSION}.zip"
          shasum -a 256 "Davit-${VERSION}.zip" > "Davit-${VERSION}.zip.sha256"

      # The zip stays the machine channel (in-app updater, Homebrew cask);
      # the DMG is the human one — mount, drag Davit to Applications.
      - name: Build DMG
        run: |
          brew install create-dmg || echo "create-dmg unavailable — plain hdiutil layout"
          VERSION="${GITHUB_REF_NAME#v}"
          scripts/make-dmg.sh dist/Davit.app "Davit-${VERSION}.dmg"
          if [ "$HAS_SIGNING" = "true" ]; then
            codesign --force --timestamp -s "$CODESIGN_IDENTITY" "Davit-${VERSION}.dmg"
          fi

      - name: Notarize DMG
        if: env.HAS_SIGNING == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: scripts/notarize.sh "Davit-${GITHUB_REF_NAME#v}.dmg"

      - name: Checksum DMG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          shasum -a 256 "Davit-${VERSION}.dmg" > "Davit-${VERSION}.dmg.sha256"

      - name: Write release notes
        run: |
          if [ "$HAS_SIGNING" = "true" ]; then
            cat > RELEASE_NOTES.md <<'NOTES'
          ## Install

          Download the DMG below, open it, and drag Davit to Applications.
          This build is Developer ID signed and notarized — it opens like any
          other app. (The zip is the same app; it's what the in-app updater
          and Homebrew use.)

          Requires an Apple silicon Mac. On first launch Davit offers to install
          Apple's container platform if it isn't present (no admin rights needed).
          NOTES
          else
            cat > RELEASE_NOTES.md <<'NOTES'
          ## Install

          1. Download the DMG below, open it, and drag Davit to Applications
             (or use the zip — same app).
          2. This build is not notarized (ad-hoc signature), so macOS will refuse to
             open it until you clear the quarantine flag:

             ```sh
             xattr -dr com.apple.quarantine /Applications/Davit.app
             ```

          Requires an Apple silicon Mac. On first launch Davit offers to install
          Apple's container platform if it isn't present (no admin rights needed).
          NOTES
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            Davit-*.dmg
            Davit-*.dmg.sha256
            Davit-*.zip
            Davit-*.zip.sha256
          generate_release_notes: true
          body_path: RELEASE_NOTES.md

      # macOS runners have no Google Cloud SDK; these two actions provide
      # credentials + gsutil for the appcast upload.
      - name: Authenticate to GCS
        if: env.HAS_GCS == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.GCS_SA_KEY }}

      - name: Set up gcloud
        if: env.HAS_GCS == 'true'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Publish appcast to davit.app
        if: env.HAS_GCS == 'true'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cat > appcast.json <<EOF
          {
            "version": "${VERSION}",
            "downloadURL": "https://github.com/wouterdebie/davit/releases/download/v${VERSION}/Davit-${VERSION}.zip",
            "releasePageURL": "https://github.com/wouterdebie/davit/releases/tag/v${VERSION}"
          }
          EOF
          gsutil -h "Cache-Control:no-cache" cp appcast.json gs://davit-app/appcast.json

      - name: Bump Homebrew tap
        if: env.HAS_TAP == 'true'
        env:
          TAP_PUSH_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA=$(cut -d' ' -f1 "Davit-${VERSION}.zip.sha256")
          git clone "https://x-access-token:${TAP_PUSH_TOKEN}@github.com/wouterdebie/homebrew-tap.git" tap
          cd tap
          sed -i '' -E "s/version \"[0-9.]+\"/version \"${VERSION}\"/" Casks/davit.rb
          sed -i '' -E "s/sha256 \"[0-9a-f]+\"/sha256 \"${SHA}\"/" Casks/davit.rb
          git config user.name "davit-release"
          git config user.email "noreply@davit.app"
          git commit -am "davit ${VERSION}"
          git push
